<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Risk Label Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: full-screen slide deck. Header bar, scrolling stage, bottom nav. Claims as headlines, one visual per slide. */
:root{--bg:#e4ebf1;--paper:#ffffff;--ink:#0e1b26;--mut:#556575;--line:#d1dbe4;--soft:#f0f4f8;--A:#c27d00;--Asoft:#f8e9c8;--B:#1d6a43;--Bsoft:#d4ebdd;--N:#5b7186;--bad:#b3261e;--grid:#e4eaf0;--hl:#fff3d1;--deep:#0c3a28;--deep2:#0a2a3a;--glow:#f2b33d;
--serif:"Newsreader",Georgia,serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--sans:"Source Sans 3",system-ui,sans-serif;--shadow:0 1px 0 rgba(10,30,50,.03),0 18px 40px -24px rgba(10,40,60,.45)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08121a;--paper:#112029;--ink:#e7eff5;--mut:#9fb2c1;--line:#25394a;--soft:#192b37;--A:#f2b441;--Asoft:#3c3217;--B:#5fc88c;--Bsoft:#173a2b;--N:#8ea4b7;--bad:#ff8c82;--grid:#1f313e;--hl:#33290f;--shadow:0 18px 40px -24px rgba(0,0,0,.8);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#08121a;--paper:#112029;--ink:#e7eff5;--mut:#9fb2c1;--line:#25394a;--soft:#192b37;--A:#f2b441;--Asoft:#3c3217;--B:#5fc88c;--Bsoft:#173a2b;--N:#8ea4b7;--bad:#ff8c82;--grid:#1f313e;--hl:#33290f;--shadow:0 18px 40px -24px rgba(0,0,0,.8);color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);font-variant-numeric:tabular-nums;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,.flip:focus-visible{outline:2px solid var(--A);outline-offset:2px}
#bar{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--paper);border-bottom:1px solid var(--line);z-index:30}
.brand{font:600 18px var(--serif);white-space:nowrap}.brand i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--A);margin-right:8px;box-shadow:0 0 0 3px var(--Asoft)}
.crumb{font:12px var(--mono);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sp{flex:1}
.ib{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 10px;font:500 12px var(--mono);color:var(--ink)}.ib:hover{background:var(--soft)}.ib[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.timer{font:500 13px var(--mono);border:1px solid var(--line);border-radius:99px;padding:5px 12px;background:var(--soft)}.timer.warn{background:var(--Asoft)}.timer.over{background:var(--bad);color:#fff;border-color:var(--bad)}
.amt{font:500 12px var(--mono)}
#stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;background:radial-gradient(1200px 500px at 85% -10%,color-mix(in srgb,var(--A) 10%,transparent),transparent 60%),radial-gradient(900px 500px at 0% 110%,color-mix(in srgb,var(--B) 12%,transparent),transparent 60%),var(--bg)}
#stage.hero{background:radial-gradient(900px 500px at 80% 10%,#1b6b4a 0%,transparent 60%),radial-gradient(800px 500px at 10% 100%,#0e4b6b 0%,transparent 60%),linear-gradient(160deg,#0a2a1f,#08202e);color:#eef6f1}
.slide{max-width:1280px;margin:0 auto;padding:26px clamp(16px,4vw,48px) 36px;animation:in .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kicker{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.claim{font-size:clamp(26px,3.5vw,42px);line-height:1.08;max-width:34ch;margin-bottom:8px}.claim em{font-style:italic;color:var(--A)}.claim b{color:var(--B);font-weight:600}
.lede{color:var(--mut);max-width:62ch;margin:0 0 16px}
.cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;align-items:start}.cols.ev{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}.cols.half{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:900px){.cols,.cols.half{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.panel h3{font-size:19px;margin-bottom:4px}.cap{font-size:14px;color:var(--mut);margin:8px 0 0;max-width:72ch}.cap b{color:var(--ink)}
.stack{display:grid;gap:14px;min-width:0}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.key{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}
.key::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--N)}.key.A::after{background:var(--A)}.key.B::after{background:var(--B)}
.key .v{font:500 clamp(24px,2.8vw,34px)/1.1 var(--mono);letter-spacing:-.02em;overflow-wrap:anywhere}.key .v small{font-size:.45em;color:var(--mut);letter-spacing:0}.key.A .v{color:var(--A)}.key.B .v{color:var(--B)}
.key .l{font-size:13px;color:var(--mut);margin-top:4px;line-height:1.3}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mut);margin:0 0 6px}.legend i{display:inline-block;width:16px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.chart{position:relative;width:100%}.chart svg{display:block;width:100%;height:auto;overflow:visible}.xs{overflow-x:auto}
svg text{font:11px var(--mono);fill:var(--mut)}svg .lbl{font:600 11px var(--sans);fill:var(--ink)}svg .big{font:500 12px var(--mono);fill:var(--ink)}
svg .grid{stroke:var(--grid)}svg .axis{stroke:var(--line)}
svg .hov{cursor:pointer;transition:opacity .15s,filter .15s}svg .hov:hover{filter:brightness(1.12) drop-shadow(0 2px 5px rgba(0,0,0,.25))}
.grow rect.b{animation:growY .8s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:bottom}
@keyframes growY{from{transform:scaleY(0)}}
path.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s ease forwards}@keyframes draw{to{stroke-dashoffset:0}}
.tip{position:fixed;z-index:80;pointer-events:none;background:#0e1b26;color:#fff;border:1px solid rgba(255,255,255,.18);font:12px/1.45 var(--mono);padding:8px 11px;border-radius:8px;max-width:280px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.35)}.tip b{color:#ffd37a}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}.seg button{border:0;background:none;font:500 12px var(--mono);padding:6px 11px;border-right:1px solid var(--line);color:var(--ink)}.seg button:last-child{border:0}.seg button[aria-pressed="true"]{background:var(--B);color:#fff}
.ctlrow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:10px}.ctlrow label,.ctl>span{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:flex;gap:8px;align-items:center}
input[type=text],select{font:500 14px var(--mono);padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:150px;max-width:100%}
input[type=range]{width:100%;accent-color:var(--B)}
.btn{border:0;background:var(--B);color:#fff;border-radius:10px;padding:9px 18px;font:600 15px var(--sans);box-shadow:0 8px 18px -10px var(--B)}.btn:hover{filter:brightness(1.1)}.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.big{font-size:18px;padding:13px 28px;background:var(--glow);color:#1a1200}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font:600 12px var(--sans);white-space:nowrap}.pill.A{background:var(--Asoft)}.pill.B{background:var(--Bsoft)}.pill.x{background:var(--soft);color:var(--mut)}.pill.bad{background:var(--bad);color:#fff}.pill.ok{background:var(--Bsoft)}
#nav{display:flex;align-items:center;gap:14px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line);z-index:30}
.dots{flex:1;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;min-width:0}.dots button{width:10px;height:10px;border-radius:50%;border:0;background:var(--line);padding:0;transition:all .25s}.dots button.on{width:28px;border-radius:6px;background:var(--B)}.dots button.done{background:color-mix(in srgb,var(--B) 45%,var(--line))}.dots .sepx{width:1px;height:14px;background:var(--line);margin:0 4px}
.navb{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 16px;font:600 14px var(--sans);min-width:92px}.navb.nx{background:var(--B);color:#fff;border-color:var(--B)}.navb:disabled{opacity:.35;cursor:default}
.drawer{visibility:hidden;position:fixed;top:0;bottom:0;right:0;width:min(360px,92vw);background:var(--paper);border-left:1px solid var(--line);z-index:70;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;padding:18px;overflow-y:auto;box-shadow:-20px 0 50px rgba(0,0,0,.25)}.drawer.open{transform:none;visibility:visible;transition-delay:0s}
.drawer h3{margin-bottom:10px}.mi{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--grid);padding:10px 4px}.mi:hover{background:var(--soft)}.mi b{font:500 12px var(--mono);width:26px;height:26px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}.mi.on b{background:var(--B);color:#fff}.mi small{margin-left:auto;color:var(--mut);font:11px var(--mono)}
.mgroup{font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:16px 0 4px}
#notes{visibility:hidden;position:fixed;left:50%;transform:translate(-50%,130%);bottom:64px;width:min(820px,94vw);background:#0e1b26;color:#eaf2f7;border-radius:14px;padding:14px 18px;z-index:60;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;box-shadow:0 20px 50px rgba(0,0,0,.45);font-size:15px}#notes.open{transform:translate(-50%,0);visibility:visible;transition-delay:0s}#notes b{color:#ffd37a;font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:4px}
.scrim{position:fixed;inset:0;background:rgba(5,15,25,.4);z-index:65;display:none}.scrim.on{display:block}
/* hero */
.hero .slide{padding-top:clamp(40px,9vh,110px);position:relative}.hero h1{font-size:clamp(40px,7vw,86px);line-height:1;max-width:14ch;letter-spacing:-.02em}.hero h1 em{color:var(--glow);font-style:italic}
.hero .sub{font-size:clamp(17px,2vw,22px);max-width:40ch;margin:18px 0 28px;color:#c4d8cf}.hero .kicker{color:#9ec3b2}
.hero .keys{margin:0 0 34px}.hero .key{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);box-shadow:none;backdrop-filter:blur(6px)}.hero .key .v{color:#fff}.hero .key.A .v{color:var(--glow)}.hero .key .l{color:#b6cfc5}
.heroline{position:absolute;right:0;top:20px;width:min(56%,720px);opacity:.5;pointer-events:none}
.herolegend{font:12px var(--mono);color:#9ec3b2;margin-top:18px}
/* cards */
.steps3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}.mv{position:relative;padding-top:56px}.mv .ic{position:absolute;left:18px;top:14px;width:34px;height:34px;border-radius:10px;background:var(--B);color:#fff;display:grid;place-items:center;font:600 16px var(--mono)}.mv:nth-child(2) .ic{background:var(--A)}.mv:nth-child(3) .ic{background:var(--N)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font:600 12px var(--mono);padding:3px 9px;border-radius:7px;cursor:default;transition:transform .15s}.chip:hover{transform:translateY(-2px)}.chip.A{background:var(--Asoft);border:1px solid var(--A)}.chip.B{background:var(--Bsoft);border:1px solid var(--B)}
/* replay & stress */
.live{display:grid;gap:10px}.liverow{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:6px}.liverow span:first-child{font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}.liverow .n{font:500 clamp(20px,2.4vw,28px) var(--mono)}
.n.A{color:var(--A)}.n.B{color:var(--B)}.n.N{color:var(--N)}
.date{font:500 clamp(18px,2vw,24px) var(--mono)}
.flash{animation:fl .5s}@keyframes fl{0%{background:var(--bad);color:#fff}100%{background:transparent}}
.bar2{height:38px;background:var(--soft);border-radius:8px;position:relative;overflow:hidden;margin:6px 0}.bar2 i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;transition:width .35s cubic-bezier(.2,.8,.2,1)}.bar2.A i{background:linear-gradient(90deg,var(--A),#e39b1a)}.bar2.B i{background:linear-gradient(90deg,var(--B),#2f9460)}.bar2 em{position:absolute;right:12px;top:0;bottom:0;display:flex;align-items:center;font:500 13px var(--mono);color:var(--mut);font-style:normal}.bar2 span{position:absolute;left:12px;top:0;bottom:0;display:flex;align-items:center;font:500 15px var(--mono);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.bigf{font:500 clamp(30px,5vw,56px)/1 var(--mono);letter-spacing:-.03em}
/* flip */
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:14px}.flip{perspective:900px;height:200px;cursor:pointer;border-radius:14px}.flip>div{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}.flip.on>div{transform:rotateY(180deg)}.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:16px;overflow:auto;border:1px solid var(--line);box-shadow:var(--shadow)}.flip .f{background:var(--paper);display:flex;flex-direction:column;justify-content:space-between}.flip .f h3{font-size:19px}.flip .f small{color:var(--mut);font:11px var(--mono)}.flip .b{background:var(--deep);color:#eaf4ee;transform:rotateY(180deg);font-size:14px}.flip .b b{color:var(--glow)}
table{border-collapse:collapse;width:100%;font-size:14px}th{font:600 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--mut);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:top}.half td:first-child{min-width:110px}td.n,th.n{text-align:right;font-family:var(--mono);white-space:nowrap}.tw{overflow-x:auto}tr.sub td{color:var(--mut);font-size:13px}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}.steps li{counter-increment:s;padding-left:32px;position:relative;min-width:0}.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);font:500 12px/22px var(--mono);text-align:center}
.eq{font:13px/1.6 var(--mono);background:var(--soft);padding:8px 10px;border-radius:6px;overflow-x:auto;margin:4px 0;white-space:pre}
ul.tight{margin:0;padding-left:20px}ul.tight li{margin-bottom:4px}
.verd{border-left:5px solid var(--B)}.verd.A{border-left-color:var(--A)}.verd h3{font-size:24px;margin-bottom:8px}
.theme-note{font-size:12px;color:var(--mut)}
@media(max-width:700px){.brand,.crumb,#setBtn,#notesBtn{display:none}#bar{padding-inline:10px;gap:6px}.navb{min-width:64px;padding:8px 10px}.dots .sepx{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}path.draw{stroke-dashoffset:0}}
.wb{position:relative;min-width:70px;height:22px;background:var(--soft)}.wb i{position:absolute;left:0;top:0;bottom:0;opacity:.8}.wb span{position:relative;font:12px/22px var(--mono);padding-left:6px}.wb.A i{background:var(--A)}.wb.B i{background:var(--B)}

.say{margin-top:16px;padding:14px 18px;border-left:4px solid var(--B);background:var(--panel,rgba(120,140,160,.08));border-radius:10px}.sayh{font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}.say ul{margin:0;padding-left:18px}.say li{font-size:clamp(15px,1.5vw,18px);line-height:1.4;margin:3px 0;max-width:110ch}.say b{color:var(--ink)}
.say{background:none;border:0;padding:0;margin-top:18px}.sayh{display:none}
.say .ins{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.say .ins li{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0;font-size:clamp(15px,1.4vw,18px);line-height:1.4;box-shadow:0 2px 10px rgba(30,50,70,.06);opacity:0;transform:translateY(12px);animation:insIn .5s ease forwards;transition:transform .2s,box-shadow .2s}
.say .ins li:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(30,50,70,.14)}
.say .dot{flex:none;width:26px;height:26px;border-radius:50%;background:var(--B);color:#fff;font:700 13px var(--mono);display:grid;place-items:center}
.say .ins li:nth-child(2) .dot{background:var(--A)}.say .ins li:nth-child(3) .dot{background:#4a6a85}
.lead{font-size:clamp(17px,1.7vw,21px);color:var(--mut);margin:2px 0 12px;max-width:80ch;opacity:0;animation:insIn .6s ease .05s forwards}
@keyframes insIn{to{opacity:1;transform:none}}

</style>
<div id="app">
 <header id="bar">
  <div class="brand"><i></i>Risk Label Lab</div><div class="crumb" id="crumb"></div><div class="sp"></div>
  <button class="ib amt" id="amtBtn" title="Change amount and other settings"></button>
  <button class="ib" id="setBtn">Settings</button><button class="ib" id="notesBtn" aria-pressed="false" title="Speaker notes (N)">Notes</button><button class="ib" id="menuBtn" title="All slides (M)">Slides</button><button class="ib" id="themeBtn">Theme</button>
  <div class="timer" id="timer" role="button" tabindex="0" title="Click to start or pause the 15-minute timer">15:00</div>
 </header>
 <main id="stage" tabindex="-1"></main>
 <footer id="nav"><button class="navb" id="prev">← Back</button><div class="dots" id="dots"></div><button class="navb nx" id="next">Next →</button></footer>
</div>
<div class="tip" id="tip"></div><div class="scrim" id="scrim"></div>
<aside class="drawer" id="menu" aria-label="All slides"></aside>
<aside class="drawer" id="settings" aria-label="Settings">
 <h3>Settings</h3><p class="theme-note">Every number on every slide follows these.</p>
 <div class="stack" style="margin-top:12px">
  <label class="ctl"><span>Amount per portfolio (₹)</span><input id="amt" type="text" inputmode="numeric" value="15,00,000" aria-label="Amount in rupees"></label>
  <div class="ctl"><span>Period</span><div id="sg-era"></div></div>
  <div class="ctl"><span>VaR confidence</span><div id="sg-conf"></div></div>
  <div class="ctl"><span>Weight limits (Test 2)</span><div id="sg-cap"></div></div>
  <div class="ctl"><span>Target return (Test 2)</span><div id="sg-basis"></div></div>
 </div>
</aside>

/*CORE*/
function pct(x,p){const s=Float64Array.from(x).sort();const k=(s.length-1)*p/100,f=Math.floor(k),c=Math.ceil(k);return s[f]+(s[c]-s[f])*(k-f);}
function varH(x,c){return -pct(x,(1-c)*100);}
function esH(x,c){const q=pct(x,(1-c)*100);let s=0,n=0;for(const v of x)if(v<=q){s+=v;n++;}return -s/n;}
function mean(x){let s=0;for(const v of x)s+=v;return s/x.length;}
function sdv(x){const m=mean(x);let s=0;for(const v of x)s+=(v-m)*(v-m);return Math.sqrt(s/(x.length-1));}

score:()=>{const c=S.conf,e=S.era,A=stat(e,'A'),B=stat(e,'B'),amt=S.amt;return [`<b>VaR</b> is the loss we do not expect to exceed on ${CN[c]} of days. <b>Expected Shortfall</b> is the average loss on the days that do exceed it.`,`<b>${EN[e]} era:</b> A's VaR is ${ratioX(A.var(c),B.var(c))} B's. On ${INR(amt)}, that is ${LK(A.var(c)*amt)} vs ${LK(B.var(c)*amt)} in one bad day.`,`<b>Takeaway:</b> the high-risk label held in every era. ES shows the tail is deeper than VaR alone.`];},

weights:()=>{const p=S.pf,T=t2num()[p];return [`<b>What you see:</b> our equal weights (top bar) against the weights an optimiser picks for the same return, using each era's data.`,`<b>Money moved</b> to reach the optimiser's weights: ${(T.today*100).toFixed(0)}% on today's data, ${(T.crisis*100).toFixed(0)}% on crisis data, ${(T.calm*100).toFixed(0)}% on calm data.`,`<b>Answer to Test 2:</b> no, the optimiser does not keep the same weights. Crisis and calm differ by ${(T.ct*100).toFixed(0)}%.`];}
